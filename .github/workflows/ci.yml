name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-linux-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci
      - run: npm test
      # 配布と同じ形（asar にまとめた状態）で起動して、入れ忘れたファイルがないか確かめる
      - name: 配布形式にまとめたデスクトップ版を起動して確かめる
        run: |
          mkdir -p ../mod/build/libs "$RUNNER_TEMP/mc"
          npx electron-builder --linux dir --publish never
          REDSTONE_MINECRAFT_DIR="$RUNNER_TEMP/mc" REDSTONE_SMOKE_RESULT="$GITHUB_WORKSPACE/app/electron-window" \
            timeout 60 xvfb-run --auto-servernum dist/linux-unpacked/project-redstone --mock --no-sandbox --disable-gpu
          cat electron-window.json
          grep -q '"hasControls":true' electron-window.json
      - uses: actions/upload-artifact@v4
        with:
          name: electron-window
          path: app/electron-window.*
        if: always()

  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          # Minecraft 本体や Fabric のダウンロードも ~/.gradle に入るので、まとめて使い回す
          cache: gradle
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: project-redstone-mod
          path: mod/build/libs/*.jar

  exe:
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-windows-${{ hashFiles('app/package-lock.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: project-redstone-mod
          path: mod/build/libs
      - run: npm ci
      - name: 本物の Fabric・Modrinth から導入できるか確認
        run: node scripts/check-setup.mjs
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: project-redstone-app-windows
          path: app/dist/*.exe
          # exe は作るときに圧縮済みなので、zip 化の時間を省く
          compression-level: 0
