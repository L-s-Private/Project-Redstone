name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  exe:
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: project-redstone-mod
          path: mod/build/libs
      - run: npm install
      - name: 本物の Fabric・Modrinth から導入できるか確認
        run: node scripts/check-setup.mjs
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: project-redstone-app-windows
          path: app/dist/ProjectRedstone.exe

  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: project-redstone-mod
          path: mod/build/libs/*.jar
